<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.chat-wrap{max-width:780px;margin:0 auto;padding:24px 0 40px}
.chat-box{height:460px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.msg{max-width:78%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.7;word-break:break-word;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-radius:18px 18px 4px 18px;font-weight:500}
.msg-bot{align-self:flex-start;background:var(--card2);border-radius:18px 18px 18px 4px}
.msg-bot.thinking{color:var(--muted)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--accent)}
.send-btn{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;cursor:pointer;font-size:18px;color:#000;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.chat-tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mode-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.mode-btn.active{background:rgba(255,215,0,0.1);border-color:var(--accent);color:var(--accent)}
.empty-state{text-align:center;margin:auto;color:var(--muted)}
.empty-state i{font-size:48px;color:rgba(255,215,0,0.3);margin-bottom:16px;display:block}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.sug-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s}
.sug-chip:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>

<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon"><i class="fa fa-robot"></i></div>
      <h1>AI Chatbot</h1>
      <p>Powered by DeepSeek V3 — Ask anything, get smart answers instantly</p>
    </div>

    <div class="chat-wrap">
      <div class="chat-tools">
        <button class="mode-btn active" onclick="setMode('deepseek',this)">DeepSeek V3</button>
        <button class="mode-btn" onclick="setMode('gemini',this)">Gemini AI</button>
        <button class="mode-btn" onclick="clearChat()"><i class="fa fa-trash"></i> Clear</button>
      </div>

      <div class="chat-box" id="chatBox">
        <div class="empty-state" id="emptyState">
          <i class="fa fa-robot"></i>
          <div>Hi! I'm your AI assistant.<br>Ask me anything!</div>
          <div class="suggestions">
            <div class="sug-chip" onclick="quickSend('What can you do?')">What can you do?</div>
            <div class="sug-chip" onclick="quickSend('Tell me a fun fact')">Tell me a fun fact</div>
            <div class="sug-chip" onclick="quickSend('Write a poem about Nigeria')">Write a poem</div>
            <div class="sug-chip" onclick="quickSend('Help me with coding')">Help with coding</div>
          </div>
        </div>
      </div>

      <div class="input-row">
        <input id="userInput" type="text" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button class="send-btn" id="sendBtn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>

<script>
const API='https://apis.davidcyril.name.ng';
let mode='deepseek';
let msgs=[];

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function clearChat(){
  msgs=[];
  const box=document.getElementById('chatBox');
  box.innerHTML='';
  box.innerHTML=`<div class="empty-state" id="emptyState"><i class="fa fa-robot"></i><div>Chat cleared! Ask me anything.</div></div>`;
}

function quickSend(text){
  document.getElementById('userInput').value=text;
  sendMsg();
}

function appendMsg(text,type){
  const box=document.getElementById('chatBox');
  const es=document.getElementById('emptyState');
  if(es)es.remove();
  const d=document.createElement('div');
  d.className='msg msg-'+type;
  d.textContent=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

async function sendMsg(){
  const inp=document.getElementById('userInput');
  const btn=document.getElementById('sendBtn');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  btn.disabled=true;

  appendMsg(text,'user');
  msgs.push({role:'user',content:text});

  const thinking=appendMsg('Thinking...','bot thinking');

  try{
    let data;
    if(mode==='deepseek'){
      const r=await fetch(`${API}/ai/deepseek-v3`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sessionId:'dc_chat_'+Date.now()})});
      data=await r.json();
      thinking.textContent=data.success?data.response:(data.message||'Error getting response');
    } else {
      const r=await fetch(`${API}/ai/gemini?text=${encodeURIComponent(text)}`);
      data=await r.json();
      thinking.textContent=data.success?data.message:(data.message||'Error getting response');
    }
    thinking.classList.remove('thinking');
  } catch(e){
    thinking.textContent='Sorry, something went wrong. Please try again.';
  }

  btn.disabled=false;
  inp.focus();
}
</script>
</body>
</html>
