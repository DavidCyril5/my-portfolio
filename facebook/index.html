<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Downloader | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#1877f2,#0d5cb6)"><i class="fab fa-facebook"></i></div>
      <h1>Facebook Downloader</h1>
      <p>Download Facebook videos in HD and SD quality — quick & easy</p>
      <div class="features" style="margin-top:16px">
        <span class="tag tag-accent">HD Quality</span>
        <span class="tag tag-accent">SD Quality</span>
        <span class="tag">Fast Download</span>
      </div>
    </div>

    <div class="card" style="max-width:680px;margin:0 auto 40px">
      <div class="input-group">
        <input id="urlInput" type="text" placeholder="Paste Facebook video URL here...">
        <button class="btn btn-primary" onclick="download()"><i class="fa fa-search"></i> Fetch</button>
      </div>
      <p style="font-size:13px;color:var(--muted)">Example: https://www.facebook.com/watch?v=...</p>

      <div id="loader" class="loader hidden"><div class="spinner"></div> Fetching video...</div>
      <div id="errorMsg" class="msg-error hidden"></div>

      <div id="result" class="hidden" style="margin-top:24px">
        <img id="thumb" class="result-thumb" style="border-radius:12px;width:100%;max-height:300px;object-fit:cover" alt="Thumbnail">
        <div class="result-actions" style="margin-top:16px">
          <a id="dlHD" href="#" target="_blank" class="btn btn-primary"><i class="fa fa-video"></i> Download HD</a>
          <a id="dlSD" href="#" target="_blank" class="btn btn-secondary"><i class="fa fa-download"></i> Download SD</a>
        </div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
async function download(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){showError('Please enter a Facebook URL');return;}
  show('loader');hide('errorMsg');hide('result');
  try{
    const r=await fetch(`${API}/facebook?url=${encodeURIComponent(url)}`);
    const d=await r.json();
    if(d.links){
      document.getElementById('thumb').src=d.thumbnail||'';
      document.getElementById('dlHD').href=d.links.hd||d.links.sd||'#';
      document.getElementById('dlSD').href=d.links.sd||'#';
      if(!d.links.hd)document.getElementById('dlHD').style.display='none';
      show('result');
    } else {showError('Failed to fetch video. Make sure the video is public.');}
  } catch(e){showError('An error occurred. Please try again.');}
  hide('loader');
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){document.getElementById('errorMsg').textContent=msg;show('errorMsg');}
</script>
</body>
</html>
