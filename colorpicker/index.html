<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.color-preview{height:200px;border-radius:16px;margin-bottom:20px;transition:background .2s;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.color-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.color-val{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s}
.color-val:hover{border-color:var(--accent)}
.color-val .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.color-val .value{font-size:14px;font-weight:700;font-family:monospace}
.palette-title{font-size:14px;color:var(--muted);margin-bottom:12px;font-weight:600}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:52px;height:52px;border-radius:10px;cursor:pointer;transition:transform .2s;border:2px solid rgba(255,255,255,0.1)}
.swatch:hover{transform:scale(1.15);border-color:rgba(255,255,255,0.3)}
input[type=color]{width:100%;height:56px;border:none;border-radius:12px;cursor:pointer;background:none;padding:0}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#f953c6,#b91d73)"><i class="fa fa-palette" style="color:#fff"></i></div>
      <h1>Color Picker</h1>
      <p>Pick colors, generate palettes and get HEX, RGB, HSL codes</p>
    </div>

    <div style="max-width:560px;margin:0 auto 40px">
      <div class="card">
        <div class="color-preview" id="preview" style="background:#FFD700;color:#000">#FFD700</div>

        <input type="color" id="colorPicker" value="#FFD700" oninput="updateColor(this.value)" style="margin-bottom:16px">

        <div class="color-info">
          <div class="color-val" onclick="copyVal('hex')" title="Click to copy">
            <div class="label">HEX</div>
            <div class="value" id="hexVal">#FFD700</div>
          </div>
          <div class="color-val" onclick="copyVal('rgb')" title="Click to copy">
            <div class="label">RGB</div>
            <div class="value" id="rgbVal">255,215,0</div>
          </div>
          <div class="color-val" onclick="copyVal('hsl')" title="Click to copy">
            <div class="label">HSL</div>
            <div class="value" id="hslVal">50,100%,50%</div>
          </div>
        </div>

        <div id="copiedMsg" style="color:var(--success);font-size:13px;text-align:center;display:none;margin-bottom:12px">✓ Copied to clipboard!</div>

        <p class="palette-title"><i class="fa fa-swatchbook" style="margin-right:6px;color:var(--accent)"></i>Generated Palette</p>
        <div class="palette" id="palette"></div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a></footer>
</div>
<script>
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function adjustColor(hex,factor){const{r,g,b}=hexToRgb(hex);return '#'+[r,g,b].map(c=>{const n=Math.min(255,Math.max(0,Math.round(c*factor)));return n.toString(16).padStart(2,'0');}).join('');}
function updateColor(hex){
  const{r,g,b}=hexToRgb(hex);
  const{h,s,l}=rgbToHsl(r,g,b);
  const brightness=(r*299+g*587+b*114)/1000;
  const textColor=brightness>128?'#000':'#fff';
  document.getElementById('preview').style.background=hex;
  document.getElementById('preview').textContent=hex.toUpperCase();
  document.getElementById('preview').style.color=textColor;
  document.getElementById('hexVal').textContent=hex.toUpperCase();
  document.getElementById('rgbVal').textContent=`${r},${g},${b}`;
  document.getElementById('hslVal').textContent=`${h},${s}%,${l}%`;
  // Generate palette
  const palette=document.getElementById('palette');
  palette.innerHTML='';
  const shades=[0.3,0.5,0.7,0.85,1,1.2,1.5,1.8];
  shades.forEach(f=>{
    const c=adjustColor(hex,f);
    const d=document.createElement('div');
    d.className='swatch';d.style.background=c;d.title=c.toUpperCase();
    d.onclick=()=>{document.getElementById('colorPicker').value=c;updateColor(c);};
    palette.appendChild(d);
  });
}
function copyVal(type){
  const vals={hex:document.getElementById('hexVal').textContent,rgb:'rgb('+document.getElementById('rgbVal').textContent+')',hsl:'hsl('+document.getElementById('hslVal').textContent+')'};
  navigator.clipboard.writeText(vals[type]);
  const msg=document.getElementById('copiedMsg');
  msg.style.display='block';setTimeout(()=>{msg.style.display='none';},2000);
}
updateColor('#FFD700');
</script>
</body>
</html>
