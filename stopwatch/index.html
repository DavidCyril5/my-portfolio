<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch & Timer | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.sw-wrap{max-width:420px;margin:0 auto 40px}
.sw-display{font-size:64px;font-weight:800;text-align:center;font-family:'Courier New',monospace;color:var(--accent);letter-spacing:-2px;padding:32px 0;text-shadow:0 0 40px rgba(255,215,0,.3)}
.sw-ms{font-size:32px;color:var(--muted)}
.sw-tabs{display:flex;background:var(--card2);border-radius:10px;overflow:hidden;margin-bottom:20px}
.sw-tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s}
.sw-tab.active{background:var(--accent);color:#000}
.lap-list{max-height:200px;overflow-y:auto;margin-top:16px}
.lap-item{display:flex;justify-content:space-between;padding:10px 14px;background:var(--card2);border-radius:8px;margin-bottom:6px;font-size:14px;font-family:monospace}
.lap-item .lap-num{color:var(--muted)}
.lap-item .lap-diff{color:var(--accent);font-size:12px}
/* Countdown */
.cd-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.cd-input{text-align:center}
.cd-input input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px 8px;color:var(--text);font-size:24px;font-weight:700;text-align:center;outline:none;font-family:monospace}
.cd-input input:focus{border-color:var(--accent)}
.cd-input label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#1a1a2e,#16213e)"><i class="fa fa-stopwatch" style="color:var(--accent)"></i></div>
      <h1>Stopwatch & Timer</h1>
      <p>Precision stopwatch with laps and countdown timer</p>
    </div>

    <div class="sw-wrap">
      <div class="card">
        <div class="sw-tabs">
          <div class="sw-tab active" id="swTab" onclick="setTab('sw')"><i class="fa fa-stopwatch"></i> Stopwatch</div>
          <div class="sw-tab" id="cdTab" onclick="setTab('cd')"><i class="fa fa-hourglass"></i> Countdown</div>
        </div>

        <!-- STOPWATCH -->
        <div id="swPane">
          <div class="sw-display"><span id="swDisplay">00:00</span><span class="sw-ms">.<span id="swMs">00</span></span></div>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-primary" id="swStartBtn" onclick="swToggle()"><i class="fa fa-play"></i> Start</button>
            <button class="btn btn-secondary" onclick="swLap()" id="lapBtn" disabled><i class="fa fa-flag"></i> Lap</button>
            <button class="btn btn-secondary" onclick="swReset()"><i class="fa fa-undo"></i> Reset</button>
          </div>
          <div class="lap-list" id="lapList"></div>
        </div>

        <!-- COUNTDOWN -->
        <div id="cdPane" style="display:none">
          <div class="cd-inputs">
            <div class="cd-input"><input id="cdH" type="number" min="0" max="99" value="0" placeholder="00"><label>Hours</label></div>
            <div class="cd-input"><input id="cdM" type="number" min="0" max="59" value="5" placeholder="00"><label>Minutes</label></div>
            <div class="cd-input"><input id="cdS" type="number" min="0" max="59" value="0" placeholder="00"><label>Seconds</label></div>
          </div>
          <div class="sw-display" id="cdDisplay">05:00<span class="sw-ms" style="font-size:20px"></span></div>
          <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn btn-primary" id="cdStartBtn" onclick="cdToggle()"><i class="fa fa-play"></i> Start</button>
            <button class="btn btn-secondary" onclick="cdReset()"><i class="fa fa-undo"></i> Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a></footer>
</div>
<script>
// STOPWATCH
let swRunning=false,swStart=0,swElapsed=0,swInterval=null,laps=[],lastLap=0;
function swToggle(){
  if(swRunning){swRunning=false;clearInterval(swInterval);swElapsed+=Date.now()-swStart;document.getElementById('swStartBtn').innerHTML='<i class="fa fa-play"></i> Resume';}
  else{swRunning=true;swStart=Date.now();swInterval=setInterval(swTick,10);document.getElementById('swStartBtn').innerHTML='<i class="fa fa-pause"></i> Pause';document.getElementById('lapBtn').disabled=false;}
}
function swTick(){
  const total=swElapsed+(Date.now()-swStart);
  const m=Math.floor(total/60000),s=Math.floor((total%60000)/1000),ms=Math.floor((total%1000)/10);
  document.getElementById('swDisplay').textContent=pad(m)+':'+pad(s);
  document.getElementById('swMs').textContent=pad(ms);
}
function swReset(){clearInterval(swInterval);swRunning=false;swElapsed=0;laps=[];lastLap=0;document.getElementById('swDisplay').textContent='00:00';document.getElementById('swMs').textContent='00';document.getElementById('swStartBtn').innerHTML='<i class="fa fa-play"></i> Start';document.getElementById('lapBtn').disabled=true;document.getElementById('lapList').innerHTML='';}
function swLap(){
  const total=swElapsed+(Date.now()-swStart);
  const diff=total-lastLap;lastLap=total;
  laps.unshift({num:laps.length+1,total,diff});
  document.getElementById('lapList').innerHTML=laps.map(l=>`<div class="lap-item"><span class="lap-num">Lap ${l.num}</span><span>${fmt(l.total)}</span><span class="lap-diff">+${fmt(l.diff)}</span></div>`).join('');
}
function fmt(ms){const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),c=Math.floor((ms%1000)/10);return pad(m)+':'+pad(s)+'.'+pad(c);}

// COUNTDOWN
let cdRunning=false,cdLeft=0,cdInterval=null;
function cdToggle(){
  if(cdRunning){cdRunning=false;clearInterval(cdInterval);document.getElementById('cdStartBtn').innerHTML='<i class="fa fa-play"></i> Resume';}
  else{
    if(!cdRunning&&cdLeft===0){
      const h=parseInt(document.getElementById('cdH').value)||0;
      const m=parseInt(document.getElementById('cdM').value)||0;
      const s=parseInt(document.getElementById('cdS').value)||0;
      cdLeft=(h*3600+m*60+s)*1000;
      if(!cdLeft)return;
    }
    cdRunning=true;cdInterval=setInterval(cdTick,100);document.getElementById('cdStartBtn').innerHTML='<i class="fa fa-pause"></i> Pause';
  }
}
function cdTick(){
  cdLeft=Math.max(0,cdLeft-100);
  const s=Math.floor(cdLeft/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  document.getElementById('cdDisplay').textContent=h>0?pad(h)+':'+pad(m%60)+':'+pad(s%60):pad(m)+':'+pad(s%60);
  if(cdLeft<=0){clearInterval(cdInterval);cdRunning=false;document.getElementById('cdStartBtn').innerHTML='<i class="fa fa-play"></i> Start';alert('⏰ Time is up!');}
}
function cdReset(){clearInterval(cdInterval);cdRunning=false;cdLeft=0;document.getElementById('cdDisplay').textContent='00:00';document.getElementById('cdStartBtn').innerHTML='<i class="fa fa-play"></i> Start';}
function pad(n){return String(n).padStart(2,'0');}

function setTab(t){
  document.getElementById('swPane').style.display=t==='sw'?'block':'none';
  document.getElementById('cdPane').style.display=t==='cd'?'block':'none';
  document.getElementById('swTab').classList.toggle('active',t==='sw');
  document.getElementById('cdTab').classList.toggle('active',t==='cd');
}
</script>
</body>
</html>
