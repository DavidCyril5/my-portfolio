<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Mail | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.email-display{background:var(--card2);border:2px solid rgba(255,215,0,0.3);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.email-addr{font-size:18px;font-weight:700;color:var(--accent);word-break:break-all}
.inbox-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mail-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.mail-item:hover{border-color:rgba(255,215,0,0.3)}
.mail-item .from{font-weight:600;font-size:14px;margin-bottom:4px}
.mail-item .subject{color:var(--muted);font-size:13px}
.mail-item .time{color:var(--muted);font-size:11px;margin-top:4px}
.empty-inbox{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-inbox i{font-size:48px;display:block;margin-bottom:16px;color:rgba(255,255,255,0.1)}
.modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;padding:28px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-close{cursor:pointer;color:var(--muted);font-size:20px}
.modal-close:hover{color:var(--text)}
.mail-body{font-size:14px;color:var(--muted);line-height:1.8;white-space:pre-wrap}
.expiry-badge{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff6b7a;padding:6px 14px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container" style="max-width:700px">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#30cfd0,#330867)"><i class="fa fa-envelope-open" style="color:#fff"></i></div>
      <h1>Temp Mail</h1>
      <p>Generate disposable temporary email addresses — protect your privacy</p>
    </div>

    <div class="card" style="margin-bottom:24px">
      <div id="emailSection">
        <div class="email-display" id="emailDisplay" style="display:none">
          <div>
            <p style="font-size:12px;color:var(--muted);margin-bottom:4px">Your temporary email:</p>
            <div class="email-addr" id="emailAddr">Generating...</div>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-secondary btn-sm" onclick="copyEmail()"><i class="fa fa-copy"></i> Copy</button>
            <button class="btn btn-primary btn-sm" onclick="generateEmail()"><i class="fa fa-refresh"></i> New</button>
          </div>
        </div>
        <button id="generateBtn" class="btn btn-primary btn-full" onclick="generateEmail()"><i class="fa fa-envelope"></i> Generate Email Address</button>
      </div>
      <div id="loader" class="loader hidden"><div class="spinner"></div> Generating email...</div>
    </div>

    <div id="inboxSection" style="display:none">
      <div class="inbox-header">
        <h3 style="font-size:18px;font-weight:700"><i class="fa fa-inbox" style="color:var(--accent);margin-right:8px"></i>Inbox <span id="msgCount" style="font-size:14px;color:var(--muted)"></span></h3>
        <button class="btn btn-secondary btn-sm" onclick="refreshInbox()"><i class="fa fa-refresh"></i> Refresh</button>
      </div>
      <div id="inbox">
        <div class="empty-inbox"><i class="fa fa-envelope-open"></i>No messages yet.<br>Your inbox will update automatically.</div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>

<div class="modal" id="mailModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalSubject" style="font-size:17px;font-weight:700"></h3>
      <i class="fa fa-times modal-close" onclick="closeModal()"></i>
    </div>
    <p id="modalFrom" style="color:var(--muted);font-size:13px;margin-bottom:16px"></p>
    <div id="modalBody" class="mail-body"></div>
  </div>
</div>

<script>
const API='https://apis.davidcyril.name.ng';
let currentEmail='',sessionId='',refreshTimer=null;

async function generateEmail(){
  show('loader');
  document.getElementById('generateBtn').style.display='none';
  try{
    const r=await fetch(`${API}/temp-mail`);
    const d=await r.json();
    if(d.success&&d.email){
      currentEmail=d.email;
      sessionId=d.session_id||d.id||d.email.split('@')[0];
      document.getElementById('emailAddr').textContent=currentEmail;
      document.getElementById('emailDisplay').style.display='flex';
      document.getElementById('inboxSection').style.display='block';
      localStorage.setItem('tempEmail',currentEmail);
      localStorage.setItem('tempSession',sessionId);
      startAutoRefresh();
    } else {alert('Failed to generate email. Try again.');}
  } catch(e){alert('Error: '+e.message);}
  hide('loader');
}

function copyEmail(){
  navigator.clipboard.writeText(currentEmail);
  const btn=event.target.closest('button');
  const orig=btn.innerHTML;
  btn.innerHTML='<i class="fa fa-check"></i> Copied!';
  setTimeout(()=>{btn.innerHTML=orig;},2000);
}

async function refreshInbox(){
  if(!sessionId)return;
  try{
    const r=await fetch(`${API}/temp-mail/inbox?id=${encodeURIComponent(sessionId)}`);
    const d=await r.json();
    const inbox=document.getElementById('inbox');
    const msgs=d.messages||d.data||[];
    if(msgs.length>0){
      document.getElementById('msgCount').textContent=`(${msgs.length})`;
      inbox.innerHTML=msgs.map((m,i)=>`
        <div class="mail-item" onclick="openMail(${i})">
          <div class="from">${m.from||m.sender||'Unknown'}</div>
          <div class="subject">${m.subject||'(No subject)'}</div>
          <div class="time">${m.date||m.time||''}</div>
        </div>
      `).join('');
      window._mails=msgs;
    } else {
      document.getElementById('msgCount').textContent='';
      inbox.innerHTML='<div class="empty-inbox"><i class="fa fa-envelope-open"></i>No messages yet.<br>Your inbox will update automatically.</div>';
    }
  } catch(e){}
}

function openMail(idx){
  const m=window._mails[idx];
  document.getElementById('modalSubject').textContent=m.subject||'(No subject)';
  document.getElementById('modalFrom').textContent='From: '+(m.from||m.sender||'Unknown');
  document.getElementById('modalBody').textContent=m.body||m.text||m.html||m.message||'(No content)';
  document.getElementById('mailModal').classList.add('open');
}
function closeModal(){document.getElementById('mailModal').classList.remove('open');}
function startAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refreshInbox,10000);refreshInbox();}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}

const saved=localStorage.getItem('tempEmail');
const savedSession=localStorage.getItem('tempSession');
if(saved&&savedSession){
  currentEmail=saved;sessionId=savedSession;
  document.getElementById('emailAddr').textContent=currentEmail;
  document.getElementById('emailDisplay').style.display='flex';
  document.getElementById('generateBtn').style.display='none';
  document.getElementById('inboxSection').style.display='block';
  startAutoRefresh();
}
</script>
</body>
</html>
