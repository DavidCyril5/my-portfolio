<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitter/X Downloader | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#1da1f2,#0d8ecf)"><i class="fab fa-twitter"></i></div>
      <h1>Twitter / X Downloader</h1>
      <p>Download Twitter and X videos in high quality — free & instant</p>
      <div class="features" style="margin-top:16px">
        <span class="tag tag-accent">HD Video</span>
        <span class="tag tag-accent">GIFs</span>
        <span class="tag">Fast</span>
      </div>
    </div>

    <div class="card" style="max-width:680px;margin:0 auto 40px">
      <div class="input-group">
        <input id="urlInput" type="text" placeholder="Paste Twitter/X post URL here...">
        <button class="btn btn-primary" onclick="download()"><i class="fa fa-search"></i> Fetch</button>
      </div>
      <p style="font-size:13px;color:var(--muted)">Example: https://twitter.com/user/status/... or https://x.com/...</p>

      <div id="loader" class="loader hidden"><div class="spinner"></div> Fetching media...</div>
      <div id="errorMsg" class="msg-error hidden"></div>

      <div id="result" class="hidden" style="margin-top:24px">
        <img id="thumb" style="width:100%;border-radius:12px;max-height:350px;object-fit:cover;display:none" alt="">
        <div class="result-actions" style="margin-top:16px" id="dlLinks"></div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
async function download(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){showError('Please enter a Twitter/X URL');return;}
  show('loader');hide('errorMsg');hide('result');
  try{
    const r=await fetch(`${API}/twitter?url=${encodeURIComponent(url)}`);
    const d=await r.json();
    if(d.success&&d.result){
      const res=d.result;
      const links=document.getElementById('dlLinks');
      links.innerHTML='';
      const vids=Array.isArray(res)?res:[res];
      vids.forEach((v,i)=>{
        if(v.url||v.download_url||v.video){
          const a=document.createElement('a');
          a.href=v.url||v.download_url||v.video;
          a.target='_blank';
          a.className='btn btn-primary';
          a.innerHTML=`<i class="fa fa-download"></i> Download ${v.quality||'Video '+(i+1)}`;
          links.appendChild(a);
        }
      });
      if(res.thumbnail){document.getElementById('thumb').src=res.thumbnail;document.getElementById('thumb').style.display='block';}
      if(links.innerHTML)show('result');
      else showError('No downloadable media found in this tweet.');
    } else {showError(d.error||d.message||'Failed to fetch media. Make sure the URL is valid.');}
  } catch(e){showError('An error occurred. Please try again.');}
  hide('loader');
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){document.getElementById('errorMsg').textContent=msg;show('errorMsg');}
</script>
</body>
</html>
