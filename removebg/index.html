<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remove Background | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .3s;background:var(--card2)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(255,215,0,0.04)}
.upload-zone i{font-size:48px;color:var(--muted);margin-bottom:16px;display:block}
.preview-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.preview-box{border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.preview-box img{width:100%;display:block}
.preview-label{background:var(--card2);padding:10px 16px;font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:580px){.preview-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#f953c6,#b91d73)"><i class="fa fa-image" style="color:#fff"></i></div>
      <h1>Remove Background</h1>
      <p>Remove image backgrounds instantly with AI — free & easy</p>
    </div>

    <div style="max-width:700px;margin:0 auto 40px">
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileSelected(event)">

      <div class="upload-zone" onclick="document.getElementById('fileInput').click()" id="uploadZone"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="onDrop(event)">
        <i class="fa fa-cloud-upload-alt"></i>
        <p style="font-size:16px;font-weight:600;margin-bottom:8px">Click or Drag & Drop your image</p>
        <p style="font-size:13px;color:var(--muted)">Supports JPG, PNG, WEBP — Max 5MB</p>
      </div>

      <div id="loader" class="loader hidden"><div class="spinner"></div> Removing background...</div>
      <div id="errorMsg" class="msg-error hidden"></div>

      <div id="result" class="hidden">
        <div class="preview-wrap">
          <div class="preview-box">
            <div class="preview-label"><i class="fa fa-image"></i> Original</div>
            <img id="originalImg" alt="Original">
          </div>
          <div class="preview-box" style="background:repeating-conic-gradient(#2a2a3a 0% 25%, transparent 0% 50%) 0 0/20px 20px">
            <div class="preview-label" style="background:var(--card2)"><i class="fa fa-wand-magic-sparkles"></i> Background Removed</div>
            <img id="resultImg" alt="Result">
          </div>
        </div>
        <div class="result-actions" style="margin-top:16px">
          <a id="downloadBtn" href="#" download="no_background.png" class="btn btn-primary"><i class="fa fa-download"></i> Download PNG</a>
          <button onclick="document.getElementById('fileInput').click()" class="btn btn-secondary"><i class="fa fa-image"></i> Try Another</button>
        </div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
const IMGBB_KEY='1fe5c36a643f15d1e5478c716f876a4c';

function onDrop(e){
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag');
  const file=e.dataTransfer.files[0];
  if(file&&file.type.startsWith('image/'))processFile(file);
}
function onFileSelected(e){const file=e.target.files[0];if(file)processFile(file);}

async function processFile(file){
  if(file.size>5*1024*1024){showError('File too large. Max 5MB.');return;}
  show('loader');hide('errorMsg');hide('result');

  // Show original
  const reader=new FileReader();
  reader.onload=e=>document.getElementById('originalImg').src=e.target.result;
  reader.readAsDataURL(file);

  try{
    // Upload to imgbb
    const form=new FormData();
    form.append('image',file);
    const upRes=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:'POST',body:form});
    const upData=await upRes.json();
    if(!upData.success)throw new Error('Image upload failed');
    const imgUrl=upData.data.url;

    // Remove background
    const rbRes=await fetch(`${API}/removebg?url=${encodeURIComponent(imgUrl)}`);
    if(!rbRes.ok)throw new Error('Background removal failed');
    const blob=await rbRes.blob();
    const blobUrl=URL.createObjectURL(blob);
    document.getElementById('resultImg').src=blobUrl;
    document.getElementById('downloadBtn').href=blobUrl;
    show('result');
  } catch(e){showError('Failed to remove background. Please try a different image.');}
  hide('loader');
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){document.getElementById('errorMsg').textContent=msg;show('errorMsg');}
</script>
</body>
</html>
