<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.chat-wrap{max-width:780px;margin:0 auto;padding:24px 0 40px}
.chat-box{height:460px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.msg{max-width:78%;padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.7;word-break:break-word;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#000;border-radius:18px 18px 4px 18px;font-weight:500}
.msg-bot{align-self:flex-start;background:var(--card2);border-radius:18px 18px 18px 4px}
.msg-bot.thinking{color:var(--muted)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:#4facfe}
.send-btn{width:52px;height:52px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;border-radius:12px;cursor:pointer;font-size:18px;color:#000;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.gemini-logo{background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty-state{text-align:center;margin:auto;color:var(--muted)}
.empty-state i{font-size:48px;margin-bottom:16px;display:block}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.sug-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s}
.sug-chip:hover{border-color:#4facfe;color:#4facfe}
.clear-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:16px}
.clear-btn:hover{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>

<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"><i class="fa fa-brain"></i></div>
      <h1><span class="gemini-logo">Gemini</span> AI Chat</h1>
      <p>Powered by Google Gemini — intelligent, creative, and helpful</p>
    </div>
  </div>

  <div class="container">
    <div class="chat-wrap">
      <button class="clear-btn" onclick="clearChat()"><i class="fa fa-trash"></i> Clear Chat</button>
      <div class="chat-box" id="chatBox">
        <div class="empty-state" id="emptyState">
          <i class="fa fa-brain" style="color:#4facfe"></i>
          <div>Hello! I'm Gemini AI.<br>What can I help you with?</div>
          <div class="suggestions">
            <div class="sug-chip" onclick="quickSend('Explain quantum computing simply')">Explain quantum computing</div>
            <div class="sug-chip" onclick="quickSend('Write a short story')">Write a short story</div>
            <div class="sug-chip" onclick="quickSend('What are the best programming languages in 2025?')">Best programming languages</div>
            <div class="sug-chip" onclick="quickSend('Give me 5 business ideas')">Business ideas</div>
          </div>
        </div>
      </div>
      <div class="input-row">
        <input id="userInput" type="text" placeholder="Ask Gemini anything..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button class="send-btn" id="sendBtn" onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by Google Gemini</footer>
</div>

<script>
const API='https://apis.davidcyril.name.ng';
function clearChat(){
  const box=document.getElementById('chatBox');
  box.innerHTML=`<div class="empty-state"><i class="fa fa-brain" style="color:#4facfe"></i><div>Chat cleared!</div></div>`;
}
function quickSend(text){document.getElementById('userInput').value=text;sendMsg();}
function appendMsg(text,type){
  const box=document.getElementById('chatBox');
  const es=document.getElementById('emptyState');
  if(es)es.remove();
  const d=document.createElement('div');
  d.className='msg msg-'+type;
  d.textContent=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}
async function sendMsg(){
  const inp=document.getElementById('userInput');
  const btn=document.getElementById('sendBtn');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  btn.disabled=true;
  appendMsg(text,'user');
  const thinking=appendMsg('Thinking...','bot thinking');
  try{
    const r=await fetch(`${API}/ai/gemini?text=${encodeURIComponent(text)}`);
    const d=await r.json();
    thinking.textContent=d.success?d.message:'Sorry, I could not process that. Try again.';
    thinking.classList.remove('thinking');
  }catch(e){thinking.textContent='Connection error. Please try again.';}
  btn.disabled=false;
  inp.focus();
}
</script>
</body>
</html>
