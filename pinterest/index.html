<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinterest Downloader | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#e60023,#ad081b)"><i class="fab fa-pinterest"></i></div>
      <h1>Pinterest Downloader</h1>
      <p>Download Pinterest videos and images — simple and fast</p>
      <div class="features" style="margin-top:16px">
        <span class="tag tag-accent">Videos</span>
        <span class="tag tag-accent">Images</span>
        <span class="tag">HD Quality</span>
      </div>
    </div>

    <div class="card" style="max-width:680px;margin:0 auto 40px">
      <div class="input-group">
        <input id="urlInput" type="text" placeholder="Paste Pinterest pin URL here...">
        <button class="btn btn-primary" onclick="download()"><i class="fa fa-search"></i> Fetch</button>
      </div>
      <p style="font-size:13px;color:var(--muted)">Example: https://www.pinterest.com/pin/...</p>

      <div id="loader" class="loader hidden"><div class="spinner"></div> Fetching media...</div>
      <div id="errorMsg" class="msg-error hidden"></div>

      <div id="result" class="hidden" style="margin-top:24px">
        <img id="thumb" style="width:100%;border-radius:12px;max-height:400px;object-fit:cover;display:none" alt="">
        <div class="result-actions" style="margin-top:16px">
          <a id="dlVideo" href="#" target="_blank" class="btn btn-primary" style="display:none"><i class="fa fa-video"></i> Download Video</a>
          <a id="dlImage" href="#" target="_blank" class="btn btn-secondary" style="display:none"><i class="fa fa-image"></i> Download Image</a>
        </div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
async function download(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){showError('Please enter a Pinterest URL');return;}
  show('loader');hide('errorMsg');hide('result');
  try{
    const r=await fetch(`${API}/pinterest?url=${encodeURIComponent(url)}`);
    const d=await r.json();
    const res=d.result||d;
    const videoUrl=res.video||res.download_url||null;
    const imgUrl=res.thumbnail||res.image||null;
    if(videoUrl||imgUrl){
      if(imgUrl){document.getElementById('thumb').src=imgUrl;document.getElementById('thumb').style.display='block';}
      if(videoUrl){document.getElementById('dlVideo').href=videoUrl;document.getElementById('dlVideo').style.display='inline-flex';}
      if(imgUrl){document.getElementById('dlImage').href=imgUrl;document.getElementById('dlImage').style.display='inline-flex';}
      show('result');
    } else {showError(d.error||'Failed to fetch media. Please check the URL.');}
  } catch(e){showError('An error occurred. Please try again.');}
  hide('loader');
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){document.getElementById('errorMsg').textContent=msg;show('errorMsg');}
</script>
</body>
</html>
