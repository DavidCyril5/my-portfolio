<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Summarizer | David Cyril</title>
<meta name="description" content="Get AI-powered summaries of any YouTube video in seconds. No watching needed.">
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#FF0000;--p2:#FF4D4D;--dark:#0F0F0F;--card:#1E1E1E;--glass:rgba(30,30,30,0.85);--gb:rgba(255,255,255,0.1);--text:#fff;--muted:#aaa;--tr:all 0.3s cubic-bezier(0.25,0.8,0.25,1);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;padding:20px;}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.18;}
.o1{width:350px;height:350px;background:#FF0000;top:10%;left:5%;animation:fl 16s ease-in-out infinite;}
.o2{width:420px;height:420px;background:#667eea;top:60%;right:5%;animation:fl 20s ease-in-out infinite 3s;}
.o3{width:280px;height:280px;background:#FF4D4D;top:35%;left:50%;animation:fl 14s ease-in-out infinite 6s;}
@keyframes fl{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-40px);}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo i{font-size:2rem;background:linear-gradient(135deg,#FF0000,#667eea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.logo span{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#FF0000,#667eea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back{background:rgba(255,255,255,0.07);border:1px solid var(--gb);color:var(--muted)!important;padding:9px 20px;border-radius:30px;font-size:0.85rem;text-decoration:none;transition:var(--tr);}
.back:hover{background:rgba(255,255,255,0.13);color:#fff!important;}
.box{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:22px;padding:40px;box-shadow:0 12px 50px rgba(0,0,0,0.4);max-width:900px;margin:0 auto;}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;}
.sub{color:var(--muted);font-size:0.93rem;margin-bottom:28px;}
input[type=url]{width:100%;padding:17px 20px;background:var(--card);border:1.5px solid var(--gb);border-radius:14px;color:var(--text);font-size:1rem;font-family:'Poppins',sans-serif;outline:none;transition:var(--tr);margin-bottom:14px;}
input[type=url]:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(255,0,0,0.15);}
input::placeholder{color:var(--muted);opacity:0.7;}
.go{width:100%;padding:17px;background:linear-gradient(135deg,#FF0000,#667eea);border:none;color:#fff;font-size:1rem;font-weight:700;border-radius:14px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(255,0,0,0.3);position:relative;overflow:hidden;}
.go::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:0.5s;}
.go:hover{transform:translateY(-2px);}
.go:hover::before{left:100%;}
.go:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.spin-wrap{display:none;flex-direction:column;align-items:center;gap:18px;padding:36px 0;}
.spin-wrap.show{display:flex;}
.spinner{width:56px;height:56px;border:5px solid rgba(255,255,255,0.08);border-radius:50%;border-top-color:#FF0000;animation:spin 0.9s linear infinite;position:relative;}
.spinner::after{content:'';position:absolute;inset:-5px;border:5px solid transparent;border-radius:50%;border-top-color:#667eea;animation:spin 1.4s linear infinite reverse;opacity:0.6;}
@keyframes spin{to{transform:rotate(360deg);}}
.result{display:none;}
.result.show{display:block;animation:fu 0.4s ease;}
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.vid-header{display:flex;gap:16px;align-items:flex-start;background:var(--card);border-radius:16px;padding:18px;margin-bottom:20px;flex-wrap:wrap;}
.vid-thumb{width:160px;height:90px;object-fit:cover;border-radius:10px;flex-shrink:0;}
.vid-title{font-size:1rem;font-weight:600;margin-bottom:6px;}
.vid-meta{font-size:0.82rem;color:var(--muted);}
.summary-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;}
.sum-label{display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;}
.sum-text{line-height:1.8;font-size:0.95rem;color:rgba(255,255,255,0.88);}
.copy-btn{margin-top:16px;background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.2);color:var(--p);padding:9px 18px;border-radius:10px;font-size:0.85rem;cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:7px;}
.copy-btn:hover{background:var(--p);color:#fff;}
.err{background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.25);border-radius:12px;padding:14px 18px;color:#ff6b6b;font-size:0.88rem;margin-top:12px;display:none;}
.err.show{display:block;}
footer{text-align:center;padding:24px 0;color:var(--muted);font-size:0.82rem;}
footer a{color:var(--p);}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div style="max-width:940px;margin:0 auto;">
  <div class="topbar">
    <a href="/" class="logo"><i class="fa fa-file-lines"></i><span>YouTube Summarizer</span></a>
    <a href="/" class="back"><i class="fa fa-arrow-left me-1"></i>Home</a>
  </div>
  <div class="box">
    <h1><i class="fa fa-file-lines me-2" style="color:var(--p)"></i>YouTube AI Summarizer</h1>
    <p class="sub">Get an AI-powered summary of any YouTube video in seconds. Understand videos without watching them fully.</p>
    <input type="url" id="url" placeholder="Paste YouTube URL — e.g. https://youtube.com/watch?v=...">
    <button class="go" id="goBtn" onclick="summarize()"><i class="fa fa-wand-magic-sparkles"></i>Summarize Video</button>
    <div class="err" id="err"></div>
    <div class="spin-wrap" id="sw">
      <div class="spinner"></div>
      <p style="color:var(--muted)">Analyzing video and generating summary...</p>
      <p style="color:var(--muted);font-size:0.82rem;">This may take 15-30 seconds.</p>
    </div>
    <div class="result mt-4" id="res">
      <div class="vid-header">
        <img id="vThumb" class="vid-thumb" src="" alt="" onerror="this.style.display='none'">
        <div>
          <div class="vid-title" id="vTitle"></div>
          <div class="vid-meta" id="vMeta"></div>
        </div>
      </div>
      <div class="summary-box">
        <div class="sum-label"><i class="fa fa-robot"></i> AI Summary</div>
        <div class="sum-text" id="sumText"></div>
        <button class="copy-btn" onclick="copySummary()"><i class="fa fa-copy"></i>Copy Summary</button>
      </div>
    </div>
  </div>
</div>
<footer><p>Made by <a href="/">David Cyril</a></p></footer>
<script>
const API='https://apis.davidcyril.name.ng';
function sh(id,v){document.getElementById(id).classList.toggle('show',v!==false);}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show');}
async function summarize(){
  const url=document.getElementById('url').value.trim();
  if(!url||(!url.includes('youtube.com')&&!url.includes('youtu.be'))){showErr('Please enter a valid YouTube URL');return;}
  document.getElementById('err').classList.remove('show');sh('res',false);sh('sw');
  document.getElementById('goBtn').disabled=true;
  try{
    const r=await fetch(`${API}/ai/yt-summarize?url=${encodeURIComponent(url)}`);
    const d=await r.json();sh('sw',false);
    if(!d||d.status===false){showErr(d.message||'Failed. Make sure the video has captions/subtitles.');document.getElementById('goBtn').disabled=false;return;}
    const v=d.data||d;
    document.getElementById('vThumb').src=v.thumbnail||'';
    document.getElementById('vTitle').textContent=v.title||'YouTube Video';
    document.getElementById('vMeta').textContent=`${v.duration?'Duration: '+v.duration:''}${v.channel?' · '+v.channel:''}`;
    const summary=v.summary||v.result||v.response||v.text||d.summary||'Summary not available.';
    document.getElementById('sumText').textContent=summary;
    sh('res');
  }catch(e){sh('sw',false);showErr('Network error. Please try again.');}
  document.getElementById('goBtn').disabled=false;
}
function copySummary(){
  const t=document.getElementById('sumText').textContent;
  navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.copy-btn');b.innerHTML='<i class="fa fa-check"></i>Copied!';setTimeout(()=>b.innerHTML='<i class="fa fa-copy"></i>Copy Summary',2000);});
}
document.getElementById('url').addEventListener('keypress',e=>{if(e.key==='Enter')summarize();});
</script>
</body>
</html>
