<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics Finder | David Cyril</title>
<meta name="description" content="Find lyrics to any song instantly by name or artist. Free lyrics search.">
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#ec4899;--p2:#f472b6;--dark:#0F0F0F;--card:#1E1E1E;--glass:rgba(30,30,30,0.85);--gb:rgba(255,255,255,0.1);--text:#fff;--muted:#aaa;--tr:all 0.3s cubic-bezier(0.25,0.8,0.25,1);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;padding:20px;}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.18;}
.o1{width:350px;height:350px;background:#ec4899;top:10%;left:5%;animation:fl 16s ease-in-out infinite;}
.o2{width:420px;height:420px;background:#8b5cf6;top:60%;right:5%;animation:fl 20s ease-in-out infinite 3s;}
.o3{width:280px;height:280px;background:#f472b6;top:35%;left:50%;animation:fl 14s ease-in-out infinite 6s;}
@keyframes fl{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-40px);}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo i{font-size:2rem;background:linear-gradient(135deg,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.logo span{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back{background:rgba(255,255,255,0.07);border:1px solid var(--gb);color:var(--muted)!important;padding:9px 20px;border-radius:30px;font-size:0.85rem;text-decoration:none;transition:var(--tr);}
.back:hover{background:rgba(255,255,255,0.13);color:#fff!important;}
.box{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:22px;padding:40px;box-shadow:0 12px 50px rgba(0,0,0,0.4);max-width:840px;margin:0 auto;}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;}
.sub{color:var(--muted);font-size:0.93rem;margin-bottom:28px;}
.input-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.sinput{flex:1;padding:16px 18px;background:var(--card);border:1.5px solid var(--gb);border-radius:14px;color:var(--text);font-size:0.95rem;font-family:'Poppins',sans-serif;outline:none;transition:var(--tr);min-width:120px;}
.sinput:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(236,72,153,0.15);}
.sinput::placeholder{color:var(--muted);opacity:0.7;}
.go{background:linear-gradient(135deg,#ec4899,#8b5cf6);border:none;color:#fff;padding:16px 28px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 6px 20px rgba(236,72,153,0.3);}
.go:hover{transform:translateY(-2px);}
.spin-wrap{display:none;flex-direction:column;align-items:center;gap:18px;padding:36px 0;}
.spin-wrap.show{display:flex;}
.spinner{width:56px;height:56px;border:5px solid rgba(255,255,255,0.08);border-radius:50%;border-top-color:#ec4899;animation:spin 0.9s linear infinite;position:relative;}
.spinner::after{content:'';position:absolute;inset:-5px;border:5px solid transparent;border-radius:50%;border-top-color:#8b5cf6;animation:spin 1.4s linear infinite reverse;opacity:0.6;}
@keyframes spin{to{transform:rotate(360deg);}}
.result{display:none;}
.result.show{display:block;animation:fu 0.4s ease;}
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.song-header{display:flex;gap:16px;align-items:flex-start;background:var(--card);border-radius:16px;padding:18px;margin-bottom:18px;flex-wrap:wrap;}
.art{width:90px;height:90px;border-radius:12px;object-fit:cover;flex-shrink:0;background:rgba(236,72,153,0.1);}
.song-name{font-size:1.2rem;font-weight:700;margin-bottom:4px;}
.artist-name{color:var(--p);font-size:0.95rem;font-weight:600;margin-bottom:6px;}
.album-name{color:var(--muted);font-size:0.83rem;}
.lyrics-box{background:rgba(255,255,255,0.03);border:1px solid var(--gb);border-radius:16px;padding:24px;max-height:500px;overflow-y:auto;}
.lyrics-box::-webkit-scrollbar{width:4px;}
.lyrics-box::-webkit-scrollbar-thumb{background:rgba(236,72,153,0.3);border-radius:2px;}
.lyrics-txt{white-space:pre-wrap;line-height:1.9;font-size:0.95rem;color:rgba(255,255,255,0.88);}
.lyr-actions{margin-top:14px;display:flex;gap:10px;}
.lact{background:rgba(236,72,153,0.08);border:1px solid rgba(236,72,153,0.2);color:var(--p);padding:9px 16px;border-radius:10px;font-size:0.85rem;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:7px;}
.lact:hover{background:var(--p);color:#fff;}
.err{background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.25);border-radius:12px;padding:14px 18px;color:#ff6b6b;font-size:0.88rem;margin-top:12px;display:none;}
.err.show{display:block;}
footer{text-align:center;padding:24px 0;color:var(--muted);font-size:0.82rem;}
footer a{color:var(--p);}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div style="max-width:880px;margin:0 auto;">
  <div class="topbar">
    <a href="/" class="logo"><i class="fa fa-music"></i><span>Lyrics Finder</span></a>
    <a href="/" class="back"><i class="fa fa-arrow-left me-1"></i>Home</a>
  </div>
  <div class="box">
    <h1><i class="fa fa-music me-2" style="color:var(--p)"></i>Lyrics Finder</h1>
    <p class="sub">Find accurate lyrics to any song instantly. Search by song title and artist name.</p>
    <div class="input-row">
      <input class="sinput" id="title" type="text" placeholder="Song title...">
      <input class="sinput" id="artist" type="text" placeholder="Artist name...">
    </div>
    <button class="go" onclick="find()" style="width:100%;justify-content:center;margin-bottom:4px;"><i class="fa fa-search"></i>Find Lyrics</button>
    <div class="err" id="err"></div>
    <div class="spin-wrap" id="sw"><div class="spinner"></div><p style="color:var(--muted)">Searching for lyrics...</p></div>
    <div class="result mt-4" id="res">
      <div class="song-header">
        <img id="art" class="art" src="" alt="" onerror="this.style.background='rgba(236,72,153,0.1)'">
        <div>
          <div class="song-name" id="songName"></div>
          <div class="artist-name" id="artistName"></div>
          <div class="album-name" id="albumName"></div>
        </div>
      </div>
      <div class="lyrics-box">
        <div class="lyrics-txt" id="lyrTxt"></div>
      </div>
      <div class="lyr-actions">
        <button class="lact" onclick="copyLyrics()"><i class="fa fa-copy"></i>Copy Lyrics</button>
      </div>
    </div>
  </div>
</div>
<footer><p>Made by <a href="/">David Cyril</a></p></footer>
<script>
const API='https://apis.davidcyril.name.ng';
function sh(id,v){document.getElementById(id).classList.toggle('show',v!==false);}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show');}
async function find(){
  const title=document.getElementById('title').value.trim();
  const artist=document.getElementById('artist').value.trim();
  if(!title){showErr('Please enter a song title');return;}
  document.getElementById('err').classList.remove('show');sh('res',false);sh('sw');
  try{
    const params=new URLSearchParams({title});
    if(artist)params.append('artist',artist);
    const r=await fetch(`${API}/lyrics?${params}`);
    const d=await r.json();sh('sw',false);
    if(!d||d.status===false){showErr(d.message||'Lyrics not found. Try a different song title or artist.');return;}
    const v=d.data||d;
    document.getElementById('art').src=v.thumbnail||v.image||v.artwork||v.cover||'';
    document.getElementById('songName').textContent=v.title||v.song||title;
    document.getElementById('artistName').textContent=v.artist||artist||'';
    document.getElementById('albumName').textContent=v.album?'Album: '+v.album:'';
    const lyrics=v.lyrics||v.text||v.content||'Lyrics not found.';
    document.getElementById('lyrTxt').textContent=lyrics;
    sh('res');
  }catch(e){sh('sw',false);showErr('Network error. Please try again.');}
}
function copyLyrics(){
  const t=document.getElementById('lyrTxt').textContent;
  navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.lact');b.innerHTML='<i class="fa fa-check"></i>Copied!';setTimeout(()=>b.innerHTML='<i class="fa fa-copy"></i>Copy Lyrics',2000);});
}
[document.getElementById('title'),document.getElementById('artist')].forEach(el=>el.addEventListener('keypress',e=>{if(e.key==='Enter')find();}));
</script>
</body>
</html>
