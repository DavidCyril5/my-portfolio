<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallVista | Stunning HD Wallpapers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --dark: #2d3436;
            --darker: #1e272e;
            --light: #f5f6fa;
            --gray: #dfe6e9;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --dark: #f5f6fa;
            --darker: #2d3436;
            --light: #1e272e;
            --gray: #2d3436;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--light);
            color: var(--dark);
            transition: var(--transition);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            padding: 1rem 2rem;
            transition: var(--transition);
        }

        [data-theme="dark"] header {
            background: rgba(30, 39, 46, 0.9);
        }

        .navbar {
            display: flex;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--dark);
        }

        .logo i {
            color: var(--primary);
        }

        .search-container {
            flex: 1;
            margin: 0 2rem;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1.5rem;
            padding-right: 3rem;
            border-radius: 50px;
            border: none;
            background: var(--gray);
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-bar:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-btn:hover {
            background: var(--primary-light);
            transform: translateY(-50%) scale(1.05);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--dark);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .search-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .results-count {
            font-size: 1.1rem;
            color: var(--dark);
        }

        .results-count strong {
            color: var(--primary);
        }

        .sort-filter {
            display: flex;
            gap: 1rem;
        }

        .sort-filter select {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid var(--gray);
            background: var(--gray);
            color: var(--dark);
            cursor: pointer;
        }

        /* Wallpaper Grid */
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .wallpaper-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .wallpaper-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .wallpaper-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .wallpaper-card:hover .wallpaper-img {
            transform: scale(1.05);
        }

        .wallpaper-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 1.5rem;
            color: white;
            opacity: 0;
            transition: var(--transition);
        }

        .wallpaper-card:hover .wallpaper-overlay {
            opacity: 1;
        }

        .wallpaper-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .wallpaper-type {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .wallpaper-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .download-btn {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 0;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--gray);
        }

        /* Load More */
        .load-more {
            grid-column: 1 / -1;
            text-align: center;
            margin: 3rem 0;
        }

        .load-btn {
            background: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .load-btn:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }

        /* Loading Spinner */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(108, 92, 231, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .wallpaper-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                margin: 1rem 0;
                width: 100%;
            }

            .nav-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (max-width: 480px) {
            .wallpaper-grid {
                grid-template-columns: 1fr;
            }

            .search-meta {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <i class="fas fa-mountain-sun"></i>
                <span>WallVista</span>
            </div>
            
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search for wallpapers..." id="searchInput">
                <button class="search-btn" id="searchButton">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="upload-btn">
                    <i class="fas fa-upload"></i>
                    Upload
                </button>
            </div>
        </div>
    </header>
    
    <main>
        <div class="search-meta">
            <div class="results-count" id="resultsCount">
                Search for amazing wallpapers
            </div>
            <div class="sort-filter">
                <select id="sortSelect">
                    <option>Popular</option>
                    <option>Newest</option>
                    <option>Trending</option>
                </select>
                <select id="filterSelect">
                    <option>All</option>
                    <option>Nature</option>
                    <option>Abstract</option>
                    <option>Minimal</option>
                </select>
            </div>
        </div>
        
        <div class="wallpaper-grid" id="wallpaperGrid">
            <!-- Wallpapers will load here -->
            <div class="empty-state">
                <i class="fas fa-image"></i>
                <h3>Discover Stunning Wallpapers</h3>
                <p>Search for wallpapers to get started</p>
            </div>
        </div>
        
        <div class="load-more" id="loadMoreContainer" style="display: none;">
            <button class="load-btn" id="loadMoreButton">
                <i class="fas fa-plus"></i> Load More
            </button>
        </div>
    </main>

    <script>
        // API Configuration
        const API_BASE = 'https://apis.davidcyriltech.my.id/search/wallpaper';
        
        // State
        let currentPage = 1;
        let currentSearch = '';
        let isLoading = false;
        let darkMode = false;
        
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const wallpaperGrid = document.getElementById('wallpaperGrid');
        const loadMoreButton = document.getElementById('loadMoreButton');
        const resultsCount = document.getElementById('resultsCount');
        const themeToggle = document.getElementById('themeToggle');
        const sortSelect = document.getElementById('sortSelect');
        const filterSelect = document.getElementById('filterSelect');
        
        // Fetch wallpapers from API
        async function fetchWallpapers(query, page = 1) {
            isLoading = true;
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE}?text=${encodeURIComponent(query)}&page=${page}`);
                const data = await response.json();
                
                if (data.success && data.result.length > 0) {
                    displayWallpapers(data.result);
                    updateResultsCount(data.result.length, query);
                    
                    if (data.result.length >= 18) {
                        loadMoreButton.style.display = 'block';
                    } else {
                        loadMoreButton.style.display = 'none';
                    }
                } else {
                    showEmptyState(query);
                }
            } catch (error) {
                console.error('Error fetching wallpapers:', error);
                showEmptyState(query);
            } finally {
                isLoading = false;
                hideLoading();
            }
        }
        
        // Display wallpapers in grid
        function displayWallpapers(wallpapers) {
            if (currentPage === 1) {
                wallpaperGrid.innerHTML = '';
            }
            
            wallpapers.forEach(wallpaper => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                card.innerHTML = `
                    <img src="${wallpaper.image}" alt="${wallpaper.title}" class="wallpaper-img" loading="lazy">
                    <div class="wallpaper-overlay">
                        <h3 class="wallpaper-title">${wallpaper.title}</h3>
                        <p class="wallpaper-type">${wallpaper.type}</p>
                        <div class="wallpaper-actions">
                            <button class="action-btn">
                                <i class="far fa-heart"></i>
                            </button>
                            <button class="action-btn">
                                <i class="far fa-bookmark"></i>
                            </button>
                            <a href="${wallpaper.image}" download class="download-btn">
                                <i class="fas fa-download"></i> Download
                            </a>
                        </div>
                    </div>
                `;
                
                wallpaperGrid.appendChild(card);
            });
        }
        
        // Update results count
        function updateResultsCount(count, query) {
            if (query) {
                resultsCount.innerHTML = `Showing <strong>${count}</strong> results for <strong>"${query}"</strong>`;
            } else {
                resultsCount.innerHTML = `Showing <strong>${count}</strong> results`;
            }
        }
        
        // Show loading state
        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'loading';
            loader.innerHTML = '<div class="spinner"></div>';
            wallpaperGrid.appendChild(loader);
        }
        
        // Hide loading state
        function hideLoading() {
            const loader = document.querySelector('.loading');
            if (loader) loader.remove();
        }
        
        // Show empty state
        function showEmptyState(query) {
            wallpaperGrid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-image"></i>
                    <h3>No wallpapers found</h3>
                    <p>Try searching for "${query || 'something else'}"</p>
                </div>
            `;
            loadMoreButton.style.display = 'none';
        }
        
        // Toggle dark mode
        function toggleDarkMode() {
            darkMode = !darkMode;
            document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            themeToggle.innerHTML = darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('darkMode', darkMode);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check for saved theme preference
            if (localStorage.getItem('darkMode') === 'true') {
                toggleDarkMode();
            }
            
            // Theme toggle
            themeToggle.addEventListener('click', toggleDarkMode);
            
            // Search functionality
            searchButton.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query && query !== currentSearch) {
                    currentSearch = query;
                    currentPage = 1;
                    fetchWallpapers(query);
                }
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchButton.click();
                }
            });
            
            // Load more functionality
            loadMoreButton.addEventListener('click', () => {
                if (!isLoading && currentSearch) {
                    currentPage++;
                    fetchWallpapers(currentSearch, currentPage);
                }
            });
            
            // Sort/Filter functionality
            sortSelect.addEventListener('change', () => {
                if (currentSearch) {
                    currentPage = 1;
                    fetchWallpapers(currentSearch);
                }
            });
            
            filterSelect.addEventListener('change', () => {
                if (currentSearch) {
                    currentPage = 1;
                    fetchWallpapers(currentSearch);
                }
            });
        });
    </script>
</body>
</html>
