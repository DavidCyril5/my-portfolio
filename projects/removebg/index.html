<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover | Powered by David Cyril</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6690222744270600"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #f5f6fa;
            --card-bg: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2d3436, #000000);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .upload-area {
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed var(--glass-border);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--glass);
            position: relative;
            overflow: hidden;
        }

        .upload-box:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
        }

        .upload-box i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .upload-box span {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .upload-box small {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #imagePreview {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            width: 100%;
        }

        .btn-red {
            background: linear-gradient(135deg, #e84393, #fd79a8);
            color: white;
        }

        .btn-red:hover {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(232, 67, 147, 0.3);
        }

        .btn-blue {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-blue:hover {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.3);
        }

        .loader {
            display: none;
            margin: 30px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #removedBgImage {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .powered {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }

        /* Drag and drop effects */
        .upload-box.drag-over {
            border-color: var(--secondary);
            background: rgba(0, 206, 201, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Background Remover</h1>
        <p class="subtitle">Upload an image and remove the background automatically!</p>

        <!-- Upload Section -->
        <div class="upload-area">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <div class="upload-box" id="uploadBox">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>Click or Drag an Image Here</span>
                <small>Supports JPG, PNG up to 10MB</small>
            </div>
        </div>

        <!-- Image Preview Section -->
        <div id="preview-container" class="preview-container">
            <img id="imagePreview" src="" alt="Image Preview">
            <button id="removeBgBtn" class="btn btn-red">
                <i class="fas fa-magic"></i> Remove Background
            </button>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Result Section -->
        <div id="result-container" class="result-container">
            <img id="removedBgImage" src="" alt="Background Removed">
            <a id="downloadBtn" class="btn btn-blue" download="no_background.png">
                <i class="fas fa-download"></i> Download Image
            </a>
        </div>

        <p class="powered">ᴍᴀᴅᴇ ʙʏ ᴅᴀᴠɪᴅ ᴄʏʀɪʟ</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const uploadBox = document.getElementById('uploadBox');
            const previewContainer = document.getElementById('preview-container');
            const imagePreview = document.getElementById('imagePreview');
            const removeBgBtn = document.getElementById('removeBgBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('result-container');
            const removedBgImage = document.getElementById('removedBgImage');
            const downloadBtn = document.getElementById('downloadBtn');

            let selectedFile = null;

            // Handle drag and drop
            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.classList.add('drag-over');
            });

            uploadBox.addEventListener('dragleave', () => {
                uploadBox.classList.remove('drag-over');
            });

            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.classList.remove('drag-over');
                
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // Handle click to upload
            uploadBox.addEventListener('click', () => {
                fileInput.click();
            });

            // Handle file selection
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            });

            // Handle file
            function handleFile(file) {
                if (!file.type.match('image.*')) {
                    showError('Please select an image file (JPEG, PNG)');
                    return;
                }
                
                if (file.size > 10 * 1024 * 1024) {
                    showError('File size should be less than 10MB');
                    return;
                }
                
                selectedFile = file;
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.style.display = 'block';
                };
                
                reader.readAsDataURL(file);
            }

            // Remove background
            removeBgBtn.addEventListener('click', removeBackground);

            async function uploadToImgBB(file) {
                const formData = new FormData();
                formData.append('image', file);
                const apiKey = '1fe5c36a643f15d1e5478c716f876a4c'; // Replace with your ImgBB API key

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                        method: 'POST',
                        body: formData,
                    });

                    const data = await response.json();

                    if (!response.ok || !data.data || !data.data.url) {
                        throw new Error('Failed to upload to ImgBB');
                    }

                    return data.data.url;
                } catch (error) {
                    console.error('ImgBB upload error:', error);
                    throw new Error('ImgBB upload failed');
                }
            }

            async function removeBackgroundUsingAPI(imgUrl) {
                const removeBgApiUrl = `https://apis.davidcyriltech.my.id/removebg?url=${encodeURIComponent(imgUrl)}&apikey=davidcyril999`;

                try {
                    const response = await fetch(removeBgApiUrl);

                    if (!response.ok) {
                        throw new Error('Failed to remove the background.');
                    }

                    const blob = await response.blob();
                    return blob;
                } catch (error) {
                    console.error('Error removing background:', error.message);
                    throw new Error('Failed to remove the background');
                }
            }

            async function removeBackground() {
                if (!selectedFile) {
                    showError("Please upload an image first!");
                    return;
                }

                // Show loading state
                loader.style.display = "block";
                removeBgBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Removing Background...';
                removeBgBtn.disabled = true;
                previewContainer.style.opacity = "0.5";

                try {
                    const uploadedUrl = await uploadToImgBB(selectedFile);
                    const noBgImageBlob = await removeBackgroundUsingAPI(uploadedUrl);

                    // Create a Blob URL for the result image
                    const blobUrl = URL.createObjectURL(noBgImageBlob);

                    // Display the result
                    removedBgImage.src = blobUrl;

                    // Set up the download button
                    downloadBtn.href = blobUrl;
                    const fileName = selectedFile.name.replace(/\.[^/.]+$/, "") + "_no_bg.png";
                    downloadBtn.download = fileName;

                    // Show results
                    previewContainer.style.display = "none";
                    resultContainer.style.display = "block";

                } catch (error) {
                    showError("Error removing background, please try again.");
                    console.error(error);
                } finally {
                    // Reset loading state
                    loader.style.display = "none";
                    removeBgBtn.innerHTML = '<i class="fas fa-magic"></i> Remove Background';
                    removeBgBtn.disabled = false;
                    previewContainer.style.opacity = "1";
                }
            }

            function showError(message) {
                // Create a nice toast notification
                const toast = document.createElement('div');
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.backgroundColor = '#ff7675';
                toast.style.color = 'white';
                toast.style.padding = '12px 24px';
                toast.style.borderRadius = '8px';
                toast.style.boxShadow = '0 4px 12px rgba(255, 118, 117, 0.3)';
                toast.style.zIndex = '1000';
                toast.style.animation = 'fadeIn 0.3s ease';
                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
                
                // Add keyframes dynamically
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fadeIn {
                        from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                        to { opacity: 1; transform: translateX(-50%) translateY(0); }
                    }
                    @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
