<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Downloader | David Cyril</title>
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo"><i class="fa-solid fa-code" style="color:var(--accent)"></i> David<span style="color:var(--accent)">Cyril</span></a>
  <a href="/" class="back-btn"><i class="fa fa-arrow-left"></i> Back Home</a>
</header>
<div class="page-wrap">
  <div class="container">
    <div class="tool-hero">
      <div class="tool-icon" style="background:linear-gradient(135deg,#ff0000,#cc0000)"><i class="fab fa-youtube"></i></div>
      <h1>YouTube Downloader</h1>
      <p>Download YouTube videos and audio in high quality — fast & free</p>
      <div class="features" style="margin-top:16px">
        <span class="tag tag-accent">MP4 Video</span>
        <span class="tag tag-accent">MP3 Audio</span>
        <span class="tag">No Watermark</span>
        <span class="tag">HD Quality</span>
      </div>
    </div>

    <div class="card" style="max-width:680px;margin:0 auto 40px">
      <div class="input-group">
        <input id="urlInput" type="text" placeholder="Paste YouTube URL here...">
        <button class="btn btn-primary" onclick="download()"><i class="fa fa-search"></i> Fetch</button>
      </div>
      <p style="font-size:13px;color:var(--muted)">Example: https://www.youtube.com/watch?v=...</p>

      <div id="loader" class="loader hidden"><div class="spinner"></div> Fetching video info...</div>
      <div id="errorMsg" class="msg-error hidden"></div>

      <div id="result" class="hidden" style="margin-top:24px">
        <img id="thumb" class="result-thumb" style="border-radius:12px;width:100%" alt="Thumbnail">
        <div style="margin-top:16px">
          <h3 id="title" style="font-size:16px;font-weight:700;margin-bottom:8px"></h3>
          <div class="result-actions">
            <a id="dlVideo" href="#" target="_blank" class="btn btn-primary"><i class="fa fa-video"></i> Download MP4</a>
            <a id="dlAudio" href="#" target="_blank" class="btn btn-secondary"><i class="fa fa-music"></i> Download MP3</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="site-footer">Built by <a href="/">David Cyril</a> &bull; Powered by <a href="https://apis.davidcyril.name.ng" target="_blank">David Cyril APIs</a></footer>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
async function download(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url){showError('Please enter a YouTube URL');return;}
  show('loader');hide('errorMsg');hide('result');
  try{
    const[vr,ar]=await Promise.all([
      fetch(`${API}/download/ytmp4?url=${encodeURIComponent(url)}`).then(r=>r.json()),
      fetch(`${API}/download/ytmp3?url=${encodeURIComponent(url)}`).then(r=>r.json())
    ]);
    if(vr.success||ar.success){
      const d=vr.success?vr.result:ar.result;
      document.getElementById('thumb').src=d.thumbnail||'';
      document.getElementById('title').textContent=d.title||'YouTube Video';
      document.getElementById('dlVideo').href=vr.success?vr.result.download_url:'#';
      document.getElementById('dlAudio').href=ar.success?ar.result.download_url:'#';
      if(!vr.success)document.getElementById('dlVideo').style.display='none';
      if(!ar.success)document.getElementById('dlAudio').style.display='none';
      show('result');
    } else {showError('Failed to fetch video. Please check the URL and try again.');}
  } catch(e){showError('An error occurred. Please try again.');}
  hide('loader');
}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){document.getElementById('errorMsg').textContent=msg;show('errorMsg');}
</script>
</body>
</html>
